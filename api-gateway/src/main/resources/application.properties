server.port=8080

spring.application.name=api-gateway

# Gateway Discovery
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Route - Page d'accueil (racine /) vers auth-service
spring.cloud.gateway.routes[0].id=home-page
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/
spring.cloud.gateway.routes[0].order=1

# Route - Login et pages web auth-service
spring.cloud.gateway.routes[1].id=auth-web-pages
spring.cloud.gateway.routes[1].uri=lb://auth-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/login,/logout,/auth2,/dashboard/**,/home,/index
spring.cloud.gateway.routes[1].order=2

# Route - Ressources statiques auth-service (CSS, JS, images)
spring.cloud.gateway.routes[2].id=auth-static-resources
spring.cloud.gateway.routes[2].uri=lb://auth-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/css/**,/js/**,/img/**,/images/**,/webjars/**
spring.cloud.gateway.routes[2].order=3

# Routes - Auth Service API
spring.cloud.gateway.routes[3].id=auth-service-api
spring.cloud.gateway.routes[3].uri=lb://auth-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=2
spring.cloud.gateway.routes[3].order=4

# Routes - Enseignant Service
spring.cloud.gateway.routes[4].id=enseignant-service
spring.cloud.gateway.routes[4].uri=lb://enseignant-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/enseignants/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=2

# Routes - Maquette Service
spring.cloud.gateway.routes[5].id=maquette-service
spring.cloud.gateway.routes[5].uri=lb://maquette-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/maquettes/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=2

# Routes - Choix Enseignement Service
spring.cloud.gateway.routes[6].id=choix-enseignement-service
spring.cloud.gateway.routes[6].uri=lb://choix-enseignement-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/choix-enseignements/**
spring.cloud.gateway.routes[6].filters[0]=StripPrefix=2

# Routes - Emploi Temps Service
spring.cloud.gateway.routes[7].id=emploi-temps-service
spring.cloud.gateway.routes[7].uri=lb://emploi-temps-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/emploi-temps/**
spring.cloud.gateway.routes[7].filters[0]=StripPrefix=2

# Routes - Deroulement Enseignement Service
spring.cloud.gateway.routes[8].id=deroulement-enseignement-service
spring.cloud.gateway.routes[8].uri=lb://deroulement-enseignement-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/deroulement-enseignements/**
spring.cloud.gateway.routes[8].filters[0]=StripPrefix=2

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator
management.endpoints.web.exposure.include=*

# CORS Global Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS,HEAD
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# Logging (pour debug CORS si nécessaire)
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.cors=DEBUG
